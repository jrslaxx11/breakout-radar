# Par de Yahoo para convertir cada divisa a USD. "inverse" = el par cotiza USD/XXX.
fx:
  EUR: {pair: "EURUSD=X"}
  GBP: {pair: "GBPUSD=X"}
  GBp: {pair: "GBPUSD=X", scale: 0.01}
  AUD: {pair: "AUDUSD=X"}
  JPY: {pair: "JPY=X", inverse: true}
  KRW: {pair: "KRW=X", inverse: true}
  TWD: {pair: "TWD=X", inverse: true}
  HKD: {pair: "HKD=X", inverse: true}
  CAD: {pair: "CAD=X", inverse: true}
  CHF: {pair: "CHF=X", inverse: true}
  SEK: {pair: "SEK=X", inverse: true}
  NOK: {pair: "NOK=X", inverse: true}
  DKK: {pair: "DKK=X", inverse: true}
  INR: {pair: "INR=X", inverse: true}
  PLN: {pair: "PLN=X", inverse: true}

