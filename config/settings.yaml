# Parámetros generales del radar. Todo lo que afecta a la puntuación vive aquí
# para que el cálculo sea reproducible de un día a otro.

run:
  history_days: 400          # sesiones descargadas (≥ 252 para máximos de 52 semanas y SMA200)
  download_chunk: 80          # tickers por petición a Yahoo
  download_pause_s: 2.0       # pausa entre bloques (evita bloqueos por exceso de peticiones)
  max_profile_fetch: 400      # perfiles (sector/industria) nuevos por ejecución; el resto queda en caché
  timezone: Europe/Madrid
  chart_bars: 330             # velas por valor en la web (las últimas 130 visibles + 200 para la SMA200)

web:
  # Dirección del Worker de Cloudflare que permite buscar cualquier ticker del mercado (ver README).
  # Vacía: el buscador solo encuentra los valores del universo diario.
  worker_url: "https://radar-yahoo.klksoyeljulen.workers.dev"

filters:                       # filtros de calidad iniciales (orientativos)
  min_mdv_usd: 5000000         # mediana de valor negociado 20 sesiones
  min_price_usd: 5
  min_mcap_usd: 500000000      # se comprueba solo en las candidatas finales

windows:
  r1m: 21
  r3m: 63
  r6m: 126
  r12m: 250
  pivot_lookback: 60           # la consolidación empieza en el máximo de las últimas 60 sesiones
  base_min: 5                  # sesiones mínimas desde ese máximo para hablar de consolidación (flag)
  cross_window: 5              # sesiones en las que se busca el día de la ruptura
  recent_highs: 3              # la ruptura también debe superar el máximo de las 3 sesiones anteriores

breakout:
  rvol_confirm: 1.5            # volumen relativo mínimo para RUPTURA CONFIRMADA
  extended_pct: 0.10           # > 10% sobre el pivote = EXTENDIDA
  extended_atr_over_sma20: 3   # > 3 ATR sobre la SMA20 = EXTENDIDA
  retest_band: 0.03            # retest: vuelve a menos de un 3% del pivote
  failed_break_pct: 0.03       # cierra > 3% bajo el pivote tras cruzarlo = ruptura fallida
  pre_dist: 0.05               # pre-breakout: a ≤ 5% de la resistencia
  pre_min_base: 10             # sesiones mínimas de base
  pre_max_depth: 0.30
  flag_min_base: 5             # flag corto: base de 5-9 sesiones y profundidad ≤ 12%
  flag_max_depth: 0.12
  base_max_dist: 0.12          # EN BASE: hasta un 12% bajo el pivote
  pinned_atr_pct: 0.008        # ATR < 0,8% y rango estrecho = precio anclado (posible OPA)

# Setup de ruptura de Qullamaggie (radar/qullamaggie.py). Obligatorios: líder, ADR, subida previa,
# duración de la base y retroceso ordenado; el resto rebaja el veredicto a "Con reservas".
qullamaggie:
  top_pct: 0.02          # entre el 2% que más sube a 1, 3 o 6 meses (cierre frente al mínimo del periodo)
  adr_min: 0.05          # ADR ≥ 5%
  prior_move_min: 0.30   # subida previa ≥ 30% en los 1-3 meses anteriores a la base
  base_min: 5            # consolidación de 5 (flag) a 60 sesiones: un 24% de sus setups pasa de 42
  base_max: 60
  tight_max: 0.50        # rango de precios de las últimas 5 sesiones ≤ 50% del rango de toda la base

# Puntuación de temáticas (suma 100). Fuerza relativa: posición frente a las demás temáticas.
theme_score:
  rs: 45
  consistency: 15
  breadth: 20
  highs: 10
  volume: 10

selection:
  top_themes: 5                # temáticas seleccionadas
  tie_points: 0.5              # se incluyen también las empatadas a ≤ 0,5 puntos de la última
  force_themes: [BIO]          # temáticas incluidas siempre (decisión del usuario 29-oct-2026)
  min_rs_pct: 0.70             # solo acciones en el 30% superior de fuerza relativa
  examine_per_theme: 10
  show_per_theme: 5
  global_top: 10
  priority: 5
  leaders_per_theme: 10        # acciones líderes (mayor fuerza relativa) que se muestran en cada temática

risk:
  earnings_near_days: 14
  earnings_mid_days: 30

regime:
  indices:
    - {sym: "^GSPC", name: "S&P 500", region: US}
    - {sym: "RSP", name: "S&P 500 equiponderado", region: US}
    - {sym: "^NDX", name: "Nasdaq 100", region: US}
    - {sym: "^RUT", name: "Russell 2000", region: US}
    - {sym: "^GSPTSE", name: "S&P/TSX", region: CA}
    - {sym: "^STOXX", name: "STOXX 600", region: EU}
    - {sym: "^GDAXI", name: "DAX", region: EU}
    - {sym: "^FCHI", name: "CAC 40", region: EU}
    - {sym: "^FTSE", name: "FTSE 100", region: EU}
    - {sym: "^IBEX", name: "IBEX 35", region: EU}
    - {sym: "^N225", name: "Nikkei 225", region: ASIA}
    - {sym: "^KS11", name: "KOSPI", region: ASIA}
    - {sym: "^TWII", name: "TAIEX", region: ASIA}
    - {sym: "^HSI", name: "Hang Seng", region: ASIA}
    - {sym: "^AXJO", name: "S&P/ASX 200", region: ASIA}
    - {sym: "^BSESN", name: "Sensex", region: ASIA}
  volatility: ["^VIX", "^VIX3M"]

