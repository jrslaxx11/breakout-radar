# Definición de temáticas.
# Cada valor se asigna a UNA temática con esta prioridad:
#   1) aparece en `tickers` de una temática (listas fijas)
#   2) su subindustria GICS (componentes del S&P 1500) está en `gics`
#   3) su industria de Yahoo (resto del universo) está en `yahoo`
# `etfs` son proxies de referencia; no entran en las clasificaciones de acciones.
# Para añadir una temática nueva basta con crear otro bloque.

themes:
