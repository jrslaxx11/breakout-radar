# Ajustes manuales verificados con fuente. Es el único lugar donde entra juicio humano.
# Los catalizadores de acción caducan a los `expires_days` días: pasado ese plazo se vuelve al
# cálculo automático (reacción a los últimos resultados).

expires_days: 21

# Catalizadores de acción (0-5 puntos). Sustituyen al cálculo automático por reacción a resultados.
stock_catalysts:
  EHC:
    points: 5
    date: 2026-10-28
    note: "3T: ingresos +8,9% y guía 2026 elevada"
    source: "https://www.sec.gov/Archives/edgar/data/0000785161/000078516126000236/ehcearningsrelease93026.htm"
  STNG:
    points: 5
    date: 2026-10-28
    note: "LR2 a 181.000 USD/día en el 4T; dividendo a 0,75 USD"
    source: "https://www.sec.gov/Archives/edgar/data/0001483934/000162828026067899/q32026earnings-exhibit991.htm"

# Exclusiones manuales (OPA, suspensiones, etc.).
exclude:
  PTC:
    reason: "OPA en efectivo de Schneider Electric a 205 USD (anunciada el 5-oct-2026): precio anclado"
    source: "https://www.tikr.com/blog/ptc-soars-33-on-22-6-billion-all-cash-schneider-electric-buyout-certain-and-compelling-value"

# Cotizaciones secundarias: se usa la principal y la otra no entra en clasificaciones.
duplicates:
  GMAB: "GMAB.CO"
  ECO: "OET.OL"
  HAFN: "HAFNI.OL"
