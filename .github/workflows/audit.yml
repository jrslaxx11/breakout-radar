name: Auditoría (volcado de precios)

# Solo a mano: descarga el universo y los precios como hace el radar y los deja como artefacto privado
# de la ejecución (3 días) para revisar los cálculos. No publica ni guarda nada en el repositorio.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -c constraints.txt
      - run: python -m radar dump audit_out
      - uses: actions/upload-artifact@v4
        with:
          name: precios
          path: audit_out
          retention-days: 3
          compression-level: 0
