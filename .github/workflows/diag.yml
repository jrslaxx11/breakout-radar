name: Diagnóstico Yahoo
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q yfinance pandas
      - name: Fechas de la última barra
        run: python diag.py 2>&1 | tee diag.txt || true
      - name: Guardar
        run: |
          git config user.name radar-bot; git config user.email bot@example.com
          git add diag.txt && git commit -m "resultado" && git push
